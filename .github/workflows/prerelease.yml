name: PreRelease Build and Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+\+1.21.4.pre'
  workflow_dispatch:
    inputs:
      version:
        description: 'Proxy version to cut, e.g. 5.0.0 (the +1.21.4.pre / +java.1.21.4 tags are derived from it)'
        required: true
        default: '5.0.0'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build-and-prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Elevate wrapper permissions
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Derive release tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            pre_tag="${INPUT_VERSION}+1.21.4.pre"
          else
            pre_tag="$REF_NAME"
          fi
          # .pre source tag, e.g. 5.0.0+1.21.4.pre
          echo "PRE_TAG=$pre_tag" >> "$GITHUB_ENV"
          # Strip the .pre suffix, then mint the launcher's java channel tag:
          #   5.0.0+1.21.4.pre -> 5.0.0+1.21.4 -> 5.0.0+java.1.21.4
          base="${pre_tag%.pre}"
          java_tag="${base/+/+java.}"
          echo "JAVA_TAG=$java_tag" >> "$GITHUB_ENV"
          # The in-app version string the jar reports (java channel).
          echo "RELEASE_TAG=$java_tag" >> "$GITHUB_ENV"
        shell: bash

      - name: Build shadow jar
        env:
          # Embedded as the in-app version (aquarius_release.txt) and the maven coords.
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          AQUARIUS_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: ./gradlew shadowJar

      - name: Stage launcher assets
        run: |
          mkdir -p artifacts
          # The launcher's java channel pulls the AquariusProxy.jar asset.
          cp build/libs/AquariusProxy.jar artifacts/AquariusProxy.jar

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'artifacts/AquariusProxy.jar'

      - name: Publish PreRelease (source tag)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.PRE_TAG }}
          artifacts: "artifacts/AquariusProxy.jar"
          prerelease: true
          allowUpdates: true
          commit: ${{ github.sha }}
          body: "Pre-release built by GitHub Actions. Not for manual download — **use the Aquarius Launcher:** https://github.com/aquariusnetwork9/AquariusProxy/releases/tag/launcher-v3"
          artifactErrorsFailBuild: true

      - name: Publish PreRelease (launcher java channel)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.JAVA_TAG }}
          artifacts: "artifacts/AquariusProxy.jar"
          prerelease: true
          allowUpdates: true
          commit: ${{ github.sha }}
          body: "Pre-release built by GitHub Actions, published on the `java.1.21.4` channel tag so the Aquarius Launcher auto-discovers it. Not for manual download — **use the Aquarius Launcher:** https://github.com/aquariusnetwork9/AquariusProxy/releases/tag/launcher-v3"
          artifactErrorsFailBuild: true
