name: 1.21.4 Integ Test

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+\+1.21.4.pre'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Elevate wrapper permissions
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: generate-and-submit
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build AquariusProxy
        run: ./gradlew build

      - name: Setup Plugin Load Test
        run: mkdir -p run/plugins

      - name: Run Plugin Load Test
        run: ./gradlew pluginLoadTest

      - name: Run Native Tests
        run: ./gradlew nativeTest

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

      - name: Upload Java Artifact
        uses: actions/upload-artifact@v7
        with:
          name: AquariusProxy-java
          path: build/libs/AquariusProxy.jar
          if-no-files-found: error
          archive: false
